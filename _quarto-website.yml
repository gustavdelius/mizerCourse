format:
  html:
    theme:
      light: cerulean
      dark: darkly
    css: styles.css
    header-includes: |
      <script>
      (function() {
        function setup() {
          var toggle = document.getElementById("nav-menu-articles");
          if (!toggle) return;

          var menu = document.querySelector('[aria-labelledby="nav-menu-articles"]');
          if (!menu) return;

          var indexHref = null;
          var links = menu.querySelectorAll("a.dropdown-item");
          for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute("href");
            if (href && /articles\/index\.html$/.test(href)) {
              indexHref = href;
              break;
            }
          }
          if (!indexHref) return;

          toggle.addEventListener("click", function(e) {
            e.preventDefault();
            window.location.href = indexHref;
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", setup);
        } else {
          setup();
        }
      })();
      </script>
    html-math-method: katex
    code-fold: false
    code-link: true
    code-copy: true
    code-block-bg: true
    code-block-border-left: "#31BAE9"
    anchor-sections: true
    link-external-newwindow: true
    df-print: paged

