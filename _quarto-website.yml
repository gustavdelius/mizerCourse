          - text: Exploring the Simulation Results
            href: https://sizespectrum.org/mizer/articles/exploring_the_simulation_results.html
          - text: A Multi-Species Model of the North Sea
            href: https://sizespectrum.org/mizer/articles/a_multispecies_model_of_the_north_sea.html
          - text: 'Cheatsheet: Analysis and Plotting'
            href: https://sizespectrum.org/mizer/articles/cheatsheet-analysis-and-plotting.html
          - text: Extending mizer
          - text: Extending mizer
            href: https://sizespectrum.org/mizer/articles/extending-mizer.html
          - text: Using mizer extension packages
            href: https://sizespectrum.org/mizer/articles/using-extension-packages.html
