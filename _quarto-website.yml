            href: https://sizespectrum.org/mizer/articles/predation_diffusion.html
          - text: Cohort dynamics and diffusion
            href: https://sizespectrum.org/mizer/articles/cohort_dynamics_and_diffusion.html
          - text: The Numerical Scheme used in Mizer
